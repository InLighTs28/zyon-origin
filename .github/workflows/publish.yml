# Posts each new GitHub release to CurseForge and Modrinth (datapack + resource pack, with their changelogs).
# Secrets: CURSEFORGE_TOKEN, MODRINTH_TOKEN. Config: .github/publish.json. Changelogs: changelogs/<version>/*.md
name: Publish to CurseForge and Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v1.0.0-beta.1)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Download release files
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir dist
      - name: Upload
        env:
          CF_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MR_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: bash .github/scripts/publish.sh
